openapi: 3.0.3
info:
  title: "CAB System API - Tạo yêu cầu đặt xe (UC06)"
  version: 1.0.0
  description: API cho phép khách hàng tạo yêu cầu đặt xe mới và bắt đầu tìm kiếm tài xế.
servers:
  - url: http://localhost:8080/api/v1
    description: Local

tags:
  - name: Trip Booking
    description: Quản lý đặt chuyến và hành trình

paths:
  /trips:
    post:
      summary: Khách hàng tạo chuyến đi mới
      operationId: createTrip
      tags:
        - Trip Booking
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTripRequest'
      responses:
        '201':
          description: Đặt xe thành công, hệ thống bắt đầu tìm tài xế
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/TripDetail'
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Chưa xác thực hoặc Token hết hạn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: UNAUTHORIZED
                  message: Token không hợp lệ hoặc đã hết hạn.
        '403':
          description: Không có quyền thực hiện (Tài khoản không phải CUSTOMER)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: FORBIDDEN
                  message: Chỉ tài khoản Khách hàng mới có thể tạo chuyến đi.
        '409':
          description: Đang có chuyến đi chưa hoàn thành
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: ACTIVE_TRIP_EXISTS
                  message: Bạn đang có một chuyến đi chưa hoàn thành. Vui lòng hoàn tất trước khi đặt chuyến mới.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Location:
      type: object
      required:
        - address
        - lat
        - lng
      properties:
        address:
          type: string
          example: "227 Nguyễn Văn Cừ, Q5, TP.HCM"
        lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: 10.762622
        lng:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: 106.682220

    CreateTripRequest:
      type: object
      required:
        - pickup_location
        - dropoff_location
        - vehicle_type
        - payment_method
      properties:
        pickup_location:
          $ref: '#/components/schemas/Location'
        dropoff_location:
          $ref: '#/components/schemas/Location'
        vehicle_type:
          type: string
          enum: [CAR_4_SEAT, CAR_7_SEAT, CAB_BIKE]
          example: CAR_4_SEAT
        payment_method:
          type: string
          enum: [CASH, WALLET, CREDIT_CARD]
          example: CASH
        promo_code:
          type: string
          example: "SUMMER2026"
        note_for_driver:
          type: string
          maxLength: 255
          example: "Đợi tôi ở trước cổng chính"

    TripDetail:
      type: object
      properties:
        id:
          type: string
          example: trip_12345
        customer_id:
          type: string
          example: usr_001
        pickup_location:
          $ref: '#/components/schemas/Location'
        dropoff_location:
          $ref: '#/components/schemas/Location'
        vehicle_type:
          type: string
          enum: [CAR_4_SEAT, CAR_7_SEAT, CAB_BIKE]
          example: CAR_4_SEAT
        payment_method:
          type: string
          enum: [CASH, WALLET, CREDIT_CARD]
          example: CASH
        fare_amount:
          type: number
          example: 55000
        currency:
          type: string
          example: VND
        status:
          type: string
          enum: [SEARCHING_DRIVER, ACCEPTED, ARRIVED, IN_TRIP, COMPLETED, CANCELLED]
          example: SEARCHING_DRIVER
        created_at:
          type: string
          format: date-time
          example: "2026-09-18T13:28:21Z"

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: ACTIVE_TRIP_EXISTS
            message:
              type: string
              example: Bạn đang có một chuyến đi chưa hoàn thành.

    ValidationErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: Dữ liệu đầu vào không hợp lệ.
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                    example: pickup_location.lat
                  message:
                    type: string
                    example: Vĩ độ không đúng định dạng.