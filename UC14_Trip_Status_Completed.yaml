openapi: 3.0.3
info:
  title: "CAB System API - Kết thúc Chuyến xe (UC14)"
  version: 1.0.0
  description: API cho phép tài xế hoàn thành chuyến xe khi đã đến điểm trả khách và tính toán chi phí cuối cùng.
servers:
  - url: http://localhost:8080/api/v1
    description: Local

tags:
  - name: Trip Tracking
    description: Quản lý và cập nhật tiến trình chuyến đi

paths:
  /trips/{trip_id}/complete:
    post:
      summary: Đã đến nơi - Hoàn thành cuốc xe
      operationId: completeTrip
      tags:
        - Trip Tracking
      security:
        - bearerAuth: []
      parameters:
        - name: trip_id
          in: path
          required: true
          description: ID của chuyến đi cần hoàn thành
          schema:
            type: string
          example: trip_12345
      responses:
        '200':
          description: Chuyến xe hoàn tất thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/TripCompletionResult'
        '401':
          description: Chưa xác thực hoặc Token hết hạn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: UNAUTHORIZED
                  message: Token không hợp lệ hoặc đã hết hạn.
        '403':
          description: Không có quyền thực hiện (Tài khoản không phải tài xế phụ trách chuyến đi)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: FORBIDDEN
                  message: Bạn không phải tài xế được phân công cho chuyến đi này.
        '404':
          description: Không tìm thấy chuyến đi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: TRIP_NOT_FOUND
                  message: Không tìm thấy chuyến đi với ID tương ứng.
        '409':
          description: Trạng thái chuyến đi không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: INVALID_TRIP_STATUS
                  message: Chuyến đi phải ở trạng thái IN_PROGRESS mới có thể hoàn thành.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    TripCompletionResult:
      type: object
      properties:
        trip_id:
          type: string
          example: trip_12345
        driver_id:
          type: string
          example: drv_009
        status:
          type: string
          enum: [COMPLETED]
          example: COMPLETED
        final_fare:
          type: number
          description: Tổng chi phí cước xe cuối cùng
          example: 85000
        currency:
          type: string
          example: VND
        payment_method:
          type: string
          enum: [CASH, WALLET, CREDIT_CARD]
          example: CASH
        payment_status:
          type: string
          enum: [PENDING, PAID]
          example: PAID
        distance_km:
          type: number
          format: float
          description: Tổng quãng đường đã di chuyển (km)
          example: 6.2
        duration_minutes:
          type: integer
          description: Tổng thời gian di chuyển (phút)
          example: 18
        completed_at:
          type: string
          format: date-time
          example: "2026-09-18T13:38:33Z"

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: INVALID_TRIP_STATUS
            message:
              type: string
              example: Chuyến đi phải ở trạng thái IN_PROGRESS mới có thể hoàn thành.