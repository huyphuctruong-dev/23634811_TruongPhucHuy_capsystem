openapi: 3.0.3
info:
  title: "CAB System API - Đăng nhập tài khoản (UC02)"
  version: 1.0.0
  description: API xác thực và cấp Token JWT.
servers:
  - url: http://localhost:8080/api/v1
    description: Local

tags:
  - name: Authentication
    description: Xác thực tài khoản

paths:
  /auth/login:
    post:
      summary: Đăng nhập tài khoản
      operationId: loginUser
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Sai thông tin đăng nhập hoặc tài khoản bị khóa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                InvalidCredentials:
                  summary: Mật khẩu hoặc Email sai
                  value:
                    success: false
                    error:
                      code: INVALID_CREDENTIALS
                      message: Email hoặc mật khẩu không chính xác.
                AccountLocked:
                  summary: Tài khoản bị khóa
                  value:
                    success: false
                    error:
                      code: ACCOUNT_LOCKED
                      message: Tài khoản của bạn đã bị khóa.

components:
  schemas:
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          example: a@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 64
          example: "Password123!"

    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        refresh_token:
          type: string
          example: "dGhpcy1pcy1hLXJlZnJlc2gtdG9rZW4..."
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          description: Thời gian hết hạn của access_token (tính bằng giây)
          example: 3600
        user:
          $ref: '#/components/schemas/UserInfo'

    UserInfo:
      type: object
      properties:
        id:
          type: string
          example: usr_001
        role:
          type: string
          enum: [CUSTOMER, DRIVER]
          example: CUSTOMER
        full_name:
          type: string
          example: Nguyen Van A
        email:
          type: string
          example: a@example.com

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: INVALID_CREDENTIALS
            message:
              type: string
              example: Email hoặc mật khẩu không chính xác.

    ValidationErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: Dữ liệu đầu vào không hợp lệ.
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                    example: email
                  message:
                    type: string
                    example: Email không đúng định dạng.