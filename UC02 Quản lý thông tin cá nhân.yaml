openapi: 3.0.3
info:
  title: "CAB System API - UC02: Cập nhật thông tin cá nhân"
  version: 1.0.0
  description: API xem và cập nhật thông tin cá nhân dành cho Khách hàng và Tài xế.
servers:
  - url: http://localhost:8080/api/v1
    description: Local
tags:
  - name: UserProfile
    description: Quản lý hồ sơ cá nhân

paths:
  /users/me:
    get:
      tags:
        - UserProfile
      summary: Xem thông tin cá nhân
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
    put:
      tags:
        - UserProfile
      summary: Cập nhật thông tin cá nhân
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    UserProfile:
      type: object
      properties:
        id:
          type: string
          example: usr_001
        full_name:
          type: string
          example: Nguyen Van A
        phone:
          type: string
          example: "0901234567"
        email:
          type: string
          example: a@example.com
        avatar_url:
          type: string
          example: https://cdn.example.com/avatars/usr_001.jpg
    UpdateProfileRequest:
      type: object
      properties:
        full_name:
          type: string
          example: Nguyen Van A