openapi: 3.0.3
info:
  title: "CAB System API - Callback Cổng Thanh Toán (UC16)"
  version: 1.0.0
  description: API Webhook cho phép các cổng thanh toán đối tác (MoMo, ZaloPay, VNPay,...) gửi thông báo kết quả thanh toán bất đồng bộ (IPN/Webhook).
servers:
  - url: http://localhost:8080/api/v1
    description: Local

tags:
  - name: Payment Engine
    description: Quản lý giao dịch, khởi tạo và xử lý thanh toán

paths:
  /payments/webhook:
    post:
      summary: Nhận kết quả thanh toán asynchronously từ đối tác
      operationId: handlePaymentWebhook
      tags:
        - Payment Engine
      parameters:
        - name: X-Signature
          in: header
          required: true
          description: Chữ ký số HMAC/SHA256 do đối tác gửi kèm để xác thực nguồn gốc dữ liệu.
          schema:
            type: string
          example: "5d41402abc4b2a76b9719d911017c592"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookPayload'
      responses:
        '200':
          description: Đã nhận và xử lý sự kiện webhook thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  acknowledged:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Webhook processed successfully.
        '400':
          description: Dữ liệu Payload không đúng định dạng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookErrorResponse'
              example:
                acknowledged: false
                error:
                  code: INVALID_PAYLOAD
                  message: Thiếu tham số hoặc định dạng Payload không hợp lệ.
        '401':
          description: Chữ ký số (Signature) không hợp lệ hoặc không thể xác thực đối tác
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookErrorResponse'
              example:
                acknowledged: false
                error:
                  code: INVALID_SIGNATURE
                  message: Xác thực chữ ký Webhook thất bại.
        '404':
          description: Không tìm thấy giao dịch hoặc chuyến đi tương ứng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookErrorResponse'
              example:
                acknowledged: false
                error:
                  code: TRANSACTION_NOT_FOUND
                  message: Không tìm thấy giao dịch với ID tương ứng.

components:
  schemas:
    WebhookPayload:
      type: object
      required:
        - transaction_id
        - trip_id
        - status
        - amount
        - provider
      properties:
        transaction_id:
          type: string
          description: Mã giao dịch phía hệ thống CAB System
          example: tx_998877
        partner_transaction_id:
          type: string
          description: Mã giao dịch tham chiếu từ cổng thanh toán đối tác
          example: MOMO_20260918001
        trip_id:
          type: string
          description: ID của chuyến đi liên quan
          example: trip_12345
        provider:
          type: string
          enum: [MOMO, ZALOPAY, VNPAY]
          example: MOMO
        amount:
          type: number
          description: Số tiền thực tế thanh toán (VND)
          example: 85000
        status:
          type: string
          enum: [SUCCESS, FAILED]
          example: SUCCESS
        failure_reason:
          type: string
          nullable: true
          description: Lý do thất bại (nếu status = FAILED)
          example: "Tài khoản không đủ số dư"
        timestamp:
          type: string
          format: date-time
          description: Thời gian xử lý giao dịch tại phía cổng thanh toán
          example: "2026-09-18T13:40:00Z"

    WebhookErrorResponse:
      type: object
      properties:
        acknowledged:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: INVALID_SIGNATURE
            message:
              type: string
              example: Xác thực chữ ký Webhook thất bại.