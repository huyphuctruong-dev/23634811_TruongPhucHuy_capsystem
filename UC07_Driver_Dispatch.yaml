openapi: 3.0.3
info:
  title: "CAB System API - Phân công tài xế tự động (UC07)"
  version: 1.0.0
  description: API phân công tự động, tìm kiếm và gửi yêu cầu chuyến đi tới tài xế thích hợp nhất.
servers:
  - url: http://localhost:8080/api/v1
    description: Local

tags:
  - name: Dispatch Engine
    description: Quản lý thuật toán và hệ thống điều phối chuyến đi

paths:
  /dispatch/assign:
    post:
      summary: Hệ thống tự động tìm và gửi thông báo cho tài xế phù hợp
      operationId: autoAssignDriver
      tags:
        - Dispatch Engine
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DispatchRequest'
      responses:
        '200':
          description: Phân công hoặc gửi tín hiệu đến tài xế thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/DispatchResponse'
        '400':
          description: Dữ liệu yêu cầu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Chưa xác thực hoặc Token hết hạn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: UNAUTHORIZED
                  message: Token không hợp lệ hoặc đã hết hạn.
        '404':
          description: Không tìm thấy chuyến đi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: TRIP_NOT_FOUND
                  message: Không tìm thấy chuyến đi với ID đã cung cấp.
        '409':
          description: Chuyến đi đã được nhận hoặc không ở trạng thái chờ tài xế
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: TRIP_ALREADY_ASSIGNED
                  message: Chuyến đi này đã được phân công cho tài xế khác.
        '422':
          description: Không tìm thấy tài xế khả dụng quanh khu vực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: NO_DRIVER_AVAILABLE
                  message: Hiện không tìm thấy tài xế nào ở gần vị trí đón.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    DispatchRequest:
      type: object
      required:
        - trip_id
      properties:
        trip_id:
          type: string
          example: trip_12345
        radius_km:
          type: number
          format: float
          default: 3.0
          example: 3.0

    DispatchResponse:
      type: object
      properties:
        trip_id:
          type: string
          example: trip_12345
        assigned_driver_id:
          type: string
          example: drv_009
        status:
          type: string
          enum: [OFFER_SENT, ACCEPTED]
          example: OFFER_SENT
        timeout_seconds:
          type: integer
          description: Thời gian chờ tài xế phản hồi trước khi chuyển sang tài xế tiếp theo
          example: 30
        assigned_at:
          type: string
          format: date-time
          example: "2026-09-18T13:30:00Z"

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: NO_DRIVER_AVAILABLE
            message:
              type: string
              example: Hiện không tìm thấy tài xế nào ở gần vị trí đón.

    ValidationErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: Dữ liệu đầu vào không hợp lệ.
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                    example: trip_id
                  message:
                    type: string
                    example: trip_id không được để trống.