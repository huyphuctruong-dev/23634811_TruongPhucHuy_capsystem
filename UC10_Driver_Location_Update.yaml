openapi: 3.0.3
info:
  title: "CAB System API - Cập nhật vị trí Tài xế (UC10)"
  version: 1.0.0
  description: API cho phép ứng dụng tài xế gửi tọa độ GPS định kỳ lên hệ thống để cập nhật vị trí thời gian thực.
servers:
  - url: http://localhost:8080/api/v1
    description: Local

tags:
  - name: Driver Tracking
    description: Quản lý định vị và theo dõi hành trình tài xế

paths:
  /driver/location:
    post:
      summary: Định kỳ gửi tọa độ GPS tài xế
      operationId: updateDriverLocation
      tags:
        - Driver Tracking
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationUpdateRequest'
      responses:
        '200':
          description: Đã ghi nhận vị trí thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/LocationUpdateResult'
        '400':
          description: Tọa độ GPS không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Chưa xác thực hoặc Token hết hạn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: UNAUTHORIZED
                  message: Token không hợp lệ hoặc đã hết hạn.
        '403':
          description: Không có quyền thực hiện (Tài khoản không phải DRIVER)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: FORBIDDEN
                  message: Chỉ tài khoản Tài xế mới có thể cập nhật vị trí.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LocationUpdateRequest:
      type: object
      required:
        - latitude
        - longitude
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: Vĩ độ (Latitude)
          example: 10.762622
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: Kinh độ (Longitude)
          example: 106.682220
        heading:
          type: number
          format: float
          minimum: 0
          maximum: 360
          description: Hướng di chuyển theo độ (0 - 360)
          example: 180.5
        speed:
          type: number
          format: float
          minimum: 0
          description: Tốc độ di chuyển (m/s hoặc km/h tùy quy chuẩn)
          example: 35.5
        accuracy:
          type: number
          format: float
          description: Độ chính xác của GPS (tính bằng mét)
          example: 5.0
        timestamp:
          type: string
          format: date-time
          description: Thời gian ghi nhận tọa độ tại thiết bị
          example: "2026-09-18T13:34:00Z"

    LocationUpdateResult:
      type: object
      properties:
        driver_id:
          type: string
          example: drv_009
        recorded_at:
          type: string
          format: date-time
          example: "2026-09-18T13:34:01Z"
        current_trip_id:
          type: string
          nullable: true
          description: ID chuyến đi hiện tại (nếu đang trong chuyến)
          example: trip_12345

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: FORBIDDEN
            message:
              type: string
              example: Chỉ tài khoản Tài xế mới có thể cập nhật vị trí.

    ValidationErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: Dữ liệu đầu vào không hợp lệ.
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                    example: latitude
                  message:
                    type: string
                    example: Vĩ độ nằm ngoài phạm vi cho phép (-90 đến 90).