openapi: 3.0.3
info:
  title: "CAB System API - Tra cứu Rating Tài xế (UC20)"
  version: 1.0.0
  description: API lấy điểm đánh giá trung bình, tổng số lượt review và danh sách phản hồi của tài xế.
servers:
  - url: http://localhost:8080/api/v1
    description: Local

tags:
  - name: Rating & Review
    description: Quản lý đánh giá và phản hồi của khách hàng về chuyến đi và tài xế

paths:
  /drivers/{driver_id}/ratings:
    get:
      summary: Lấy lịch sử đánh giá và sao trung bình của tài xế
      operationId: getDriverRatings
      tags:
        - Rating & Review
      security:
        - bearerAuth: []
      parameters:
        - name: driver_id
          in: path
          required: true
          description: ID của tài xế cần tra cứu
          schema:
            type: string
          example: drv_009
        - name: page
          in: query
          required: false
          description: Trang hiện tại (phân trang)
          schema:
            type: integer
            default: 1
          example: 1
        - name: limit
          in: query
          required: false
          description: Số lượng bản ghi trên mỗi trang
          schema:
            type: integer
            default: 10
          example: 10
      responses:
        '200':
          description: Lấy thông tin đánh giá tài xế thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/DriverRatingSummary'
        '401':
          description: Chưa xác thực hoặc Token hết hạn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: UNAUTHORIZED
                  message: Token không hợp lệ hoặc đã hết hạn.
        '404':
          description: Không tìm thấy tài xế
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: DRIVER_NOT_FOUND
                  message: Không tìm thấy tài xế với ID tương ứng.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    DriverRatingSummary:
      type: object
      properties:
        driver_id:
          type: string
          example: drv_009
        average_rating:
          type: number
          format: float
          description: Điểm đánh giá trung bình
          example: 4.85
        total_reviews:
          type: integer
          description: Tổng số lượt đánh giá
          example: 120
        rating_breakdown:
          type: object
          description: Phân bố số lượng đánh giá theo từng mức sao
          properties:
            5_star:
              type: integer
              example: 100
            4_star:
              type: integer
              example: 15
            3_star:
              type: integer
              example: 3
            2_star:
              type: integer
              example: 1
            1_star:
              type: integer
              example: 1
        reviews:
          type: array
          items:
            $ref: '#/components/schemas/ReviewItem'
        pagination:
          type: object
          properties:
            page:
              type: integer
              example: 1
            limit:
              type: integer
              example: 10
            total_pages:
              type: integer
              example: 12

    ReviewItem:
      type: object
      properties:
        rating_id:
          type: string
          example: rate_778899
        trip_id:
          type: string
          example: trip_12345
        passenger_name:
          type: string
          description: Tên rút gọn/ẩn danh của khách hàng
          example: "Nguyen V."
        rating_stars:
          type: integer
          example: 5
        comment:
          type: string
          example: "Xe đi rất êm và an toàn!"
        tags:
          type: array
          items:
            type: string
          example: ["Lái xe an toàn", "Xe sạch sẻ"]
        created_at:
          type: string
          format: date-time
          example: "2026-09-18T13:44:03Z"

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: DRIVER_NOT_FOUND
            message:
              type: string
              example: Không tìm thấy tài xế với ID tương ứng.