openapi: 3.0.3
info:
  title: "CAB System API - Đăng ký tài khoản (UC01)"
  version: 1.0.0
  description: API đăng ký tài khoản cho Khách hàng và Tài xế.
servers:
  - url: http://localhost:8080/api/v1
    description: Local

tags:
  - name: Authentication
    description: Xác thực tài khoản

paths:
  /auth/register:
    post:
      summary: Đăng ký tài khoản mới
      operationId: registerUser
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Đăng ký thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/UserResponse'
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '409':
          description: Email hoặc Số điện thoại đã tồn tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                EmailExists:
                  summary: Email đã tồn tại
                  value:
                    success: false
                    error:
                      code: EMAIL_ALREADY_EXISTS
                      message: Email đã được sử dụng.
                PhoneExists:
                  summary: Số điện thoại đã tồn tại
                  value:
                    success: false
                    error:
                      code: PHONE_ALREADY_EXISTS
                      message: Số điện thoại đã được sử dụng.

components:
  schemas:
    RegisterRequest:
      type: object
      required:
        - role
        - full_name
        - phone
        - email
        - password
      properties:
        role:
          type: string
          enum: [CUSTOMER, DRIVER]
          example: CUSTOMER
        full_name:
          type: string
          minLength: 2
          maxLength: 100
          example: Nguyen Van A
        phone:
          type: string
          pattern: '^(0|\+84)[0-9]{9}$'
          example: "0901234567"
        email:
          type: string
          format: email
          maxLength: 255
          example: a@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 64
          example: "Password123!"

    UserResponse:
      type: object
      properties:
        id:
          type: string
          example: usr_001
        role:
          type: string
          enum: [CUSTOMER, DRIVER]
          example: CUSTOMER
        full_name:
          type: string
          example: Nguyen Van A
        phone:
          type: string
          example: "0901234567"
        email:
          type: string
          example: a@example.com
        status:
          type: string
          enum: [ACTIVE, INACTIVE, PENDING_VERIFICATION]
          example: ACTIVE

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: EMAIL_ALREADY_EXISTS
            message:
              type: string
              example: Email đã được sử dụng.

    ValidationErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: Dữ liệu đầu vào không hợp lệ.
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                    example: phone
                  message:
                    type: string
                    example: Số điện thoại không đúng định dạng.