openapi: 3.0.3
info:
  title: "CAB System API - Xác minh tài xế KYC (UC04)"
  version: 1.0.0
  description: API gửi và xác minh hồ sơ KYC dành cho tài xế.
servers:
  - url: http://localhost:8080/api/v1
    description: Local

tags:
  - name: Driver KYC
    description: Quản lý xác minh thông tin tài xế

paths:
  /driver/kyc:
    post:
      summary: Gửi hồ sơ đăng ký tài xế
      operationId: submitDriverKYC
      tags:
        - Driver KYC
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KYCRequest'
      responses:
        '200':
          description: Đã nhận hồ sơ, chờ duyệt
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/KYCResponse'
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Chưa xác thực hoặc Token hết hạn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: UNAUTHORIZED
                  message: Token không hợp lệ hoặc đã hết hạn.
        '403':
          description: Không có quyền truy cập (Chỉ dành cho tài khoản role DRIVER)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: FORBIDDEN
                  message: Bạn không có quyền thực hiện chức năng này.
        '409':
          description: Hồ sơ đã được gửi trước đó hoặc Biển số/GPLX đã tồn tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                AlreadySubmitted:
                  summary: Hồ sơ đang chờ duyệt hoặc đã duyệt
                  value:
                    success: false
                    error:
                      code: KYC_ALREADY_SUBMITTED
                      message: Hồ sơ KYC của bạn đang trong quá trình xử lý hoặc đã hoàn tất.
                PlateExists:
                  summary: Biển số xe đã được đăng ký
                  value:
                    success: false
                    error:
                      code: VEHICLE_PLATE_EXISTS
                      message: Biển số xe đã được đăng ký bởi tài xế khác.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    KYCRequest:
      type: object
      required:
        - license_number
        - vehicle_plate
        - vehicle_type
      properties:
        license_number:
          type: string
          minLength: 8
          maxLength: 20
          example: "GPLX-12345678"
        vehicle_plate:
          type: string
          pattern: '^[0-9]{2}[A-Z]{1,2}-[0-9]{4,5}$'
          example: "51H-999.99"
        vehicle_type:
          type: string
          enum: [CAR_4_SEAT, CAR_7_SEAT, CAB_BIKE]
          example: CAR_4_SEAT
        license_image_front:
          type: string
          format: uri
          maxLength: 500
          example: "https://example.com/license-front.jpg"
        license_image_back:
          type: string
          format: uri
          maxLength: 500
          example: "https://example.com/license-back.jpg"

    KYCResponse:
      type: object
      properties:
        driver_id:
          type: string
          example: drv_001
        status:
          type: string
          enum: [PENDING_APPROVAL, APPROVED, REJECTED]
          example: PENDING_APPROVAL
        submitted_at:
          type: string
          format: date-time
          example: "2026-09-18T13:22:37Z"

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: KYC_ALREADY_SUBMITTED
            message:
              type: string
              example: Hồ sơ KYC của bạn đang trong quá trình xử lý.

    ValidationErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: Dữ liệu đầu vào không hợp lệ.
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                    example: vehicle_plate
                  message:
                    type: string
                    example: Biển số xe không đúng định dạng.