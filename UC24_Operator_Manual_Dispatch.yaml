openapi: 3.0.3
info:
  title: "CAB System API - Điều xe thủ công (UC24)"
  version: 1.0.0
  description: API dành cho Điều hành viên (Operator) gán tài xế thủ công hoặc gán cưỡng chế cho một cuốc xe cụ thể khi hệ thống tự động không tìm được tài xế.
servers:
  - url: http://localhost:8080/api/v1
    description: Local

tags:
  - name: Operator Operations
    description: Các thao tác dành cho bộ phận điều hành viên trung tâm

paths:
  /operator/assign-driver:
    post:
      summary: Điều hành viên gán cưỡng chế tài xế cho chuyến đi
      operationId: manualAssignDriver
      tags:
        - Operator Operations
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualAssignRequest'
      responses:
        '200':
          description: Gán tài xế thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ManualAssignResult'
        '400':
          description: Dữ liệu đầu vào không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Chưa xác thực hoặc Token hết hạn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: UNAUTHORIZED
                  message: Token không hợp lệ hoặc đã hết hạn.
        '403':
          description: Không có quyền thực hiện (Chỉ Điều hành viên/Admin mới có quyền)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: FORBIDDEN
                  message: Bạn không có quyền điều xe thủ công.
        '404':
          description: Không tìm thấy chuyến đi hoặc tài xế
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                TripNotFound:
                  summary: Không tìm thấy chuyến đi
                  value:
                    success: false
                    error:
                      code: TRIP_NOT_FOUND
                      message: Không tìm thấy chuyến đi với ID tương ứng.
                DriverNotFound:
                  summary: Không tìm thấy tài xế
                  value:
                    success: false
                    error:
                      code: DRIVER_NOT_FOUND
                      message: Không tìm thấy tài xế với ID tương ứng.
        '409':
          description: Xung đột trạng thái (Tài xế bận hoặc Chuyến đi đã có người tiếp nhận/đã hủy)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                DriverBusy:
                  summary: Tài xế đang trong cuốc xe khác
                  value:
                    success: false
                    error:
                      code: DRIVER_BUSY
                      message: Tài xế hiện đang thực hiện một chuyến đi khác.
                InvalidTripStatus:
                  summary: Trạng thái chuyến đi không hợp lệ
                  value:
                    success: false
                    error:
                      code: INVALID_TRIP_STATUS
                      message: Chuyến đi đã hoàn thành hoặc đã bị hủy.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ManualAssignRequest:
      type: object
      required:
        - trip_id
        - driver_id
      properties:
        trip_id:
          type: string
          description: Mã định danh của chuyến đi cần điều xe
          example: trip_12345
        driver_id:
          type: string
          description: Mã định danh của tài xế được gán
          example: drv_009
        note:
          type: string
          description: Ghi chú của điều hành viên (lý do điều tay)
          example: "Khách hàng yêu cầu hỗ trợ gấp qua tổng đài"

    ManualAssignResult:
      type: object
      properties:
        trip_id:
          type: string
          example: trip_12345
        driver_id:
          type: string
          example: drv_009
        status:
          type: string
          description: Trạng thái mới của chuyến đi
          example: ACCEPTED
        assigned_by:
          type: string
          description: Mã ID của điều hành viên thực hiện
          example: op_001
        assigned_at:
          type: string
          format: date-time
          example: "2026-09-18T13:51:47Z"

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: DRIVER_BUSY
            message:
              type: string
              example: Tài xế hiện đang thực hiện một chuyến đi khác.

    ValidationErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: Dữ liệu đầu vào không hợp lệ.
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                    example: driver_id
                  message:
                    type: string
                    example: Trường driver_id không được để trống.