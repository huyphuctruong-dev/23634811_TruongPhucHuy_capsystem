use_case_id: UC15
use_case_name: Tính thời gian dự kiến đến (ETA)
module: Trip Tracking Module
actor_chinh: Hệ thống
actor_phu:
- Khách hàng
- Tài xế
mo_ta_ngan: Hệ thống tính toán và cập nhật liên tục thời gian dự kiến tài xế đến điểm đón hoặc điểm trả khách.
tien_dieu_kien:
- Có vị trí hiện tại của tài xế và điểm đích tương ứng (điểm đón hoặc điểm đến)
hau_dieu_kien:
- ETA được tính toán và hiển thị cho khách hàng và tài xế
luong_chinh:
- stt: 1
  mo_ta: Hệ thống lấy vị trí hiện tại của tài xế và điểm đích tương ứng.
- stt: 2
  mo_ta: Hệ thống tính khoảng cách và thời gian di chuyển dự kiến dựa trên dữ liệu bản đồ/giao thông.
- stt: 3
  mo_ta: Hệ thống cập nhật và hiển thị ETA trên giao diện khách hàng và tài xế.
- stt: 4
  mo_ta: Hệ thống tính lại ETA định kỳ khi vị trí tài xế thay đổi (UC12).
luong_ngoai_le:
- ma: E1
  ten: Không lấy được dữ liệu bản đồ/giao thông
  mo_ta: Hệ thống hiển thị ETA ước tính gần nhất hoặc thông báo thời gian đến chưa xác định.
quy_tac_lien_quan: []
ghi_chu: ''
