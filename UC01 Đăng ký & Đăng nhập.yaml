openapi: 3.0.3
info:
  title: "CAB System API - UC01: Đăng ký & Đăng nhập"
  version: 1.0.0
  description: API phục vụ đăng ký tài khoản và xác thực người dùng CAB System.
servers:
  - url: http://localhost:8080/api/v1
    description: Local
  - url: https://api.example.com/api/v1
    description: Production
security:
  - bearerAuth: []
tags:
  - name: Authentication
    description: Đăng ký, đăng nhập và xác thực tài khoản
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: EMAIL_ALREADY_EXISTS
            message:
              type: string
              example: Email đã được sử dụng.
            details:
              type: object
              additionalProperties: true
        meta:
          type: object
          properties:
            request_id:
              type: string
              example: req_01JABCXYZ
    User:
      type: object
      required:
        - id
        - role
        - full_name
        - phone
        - email
        - status
      properties:
        id:
          type: string
          example: usr_001
        role:
          type: string
          enum: [CUSTOMER, DRIVER, OPERATOR, ADMINISTRATOR]
          example: CUSTOMER
        full_name:
          type: string
          example: Nguyen Van A
        phone:
          type: string
          example: "0901234567"
        email:
          type: string
          format: email
          example: a@example.com
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
          example: ACTIVE
    RegisterRequest:
      type: object
      required: [role, full_name, phone, email, password]
      properties:
        role:
          type: string
          enum: [CUSTOMER, DRIVER]
          example: CUSTOMER
        full_name:
          type: string
          minLength: 2
          maxLength: 100
          example: Nguyen Van A
        phone:
          type: string
          pattern: '^[0-9]{10,11}$'
          example: "0901234567"
        email:
          type: string
          format: email
          example: a@example.com
        password:
          type: string
          format: password
          minLength: 8
          example: "Password123!"
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: a@example.com
        password:
          type: string
          format: password
          example: "Password123!"
    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            access_token:
              type: string
              example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9
            token_type:
              type: string
              example: Bearer
            expires_in:
              type: integer
              example: 3600
            user:
              $ref: '#/components/schemas/User'
        meta:
          type: object
          additionalProperties: true
paths:
  /auth/register:
    post:
      security: []
      summary: Đăng ký tài khoản
      description: Cho phép khách hàng hoặc tài xế tạo tài khoản mới trên CAB System.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Đăng ký tài khoản thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email/Số điện thoại đã tồn tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/login:
    post:
      security: []
      summary: Đăng nhập tài khoản
      description: Xác thực người dùng và cấp mã Access Token (JWT).
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Thông tin đăng nhập không chính xác
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'