openapi: 3.0.3
info:
  title: "CAB System API - UC05: Cập nhật trạng thái sẵn sàng tài xế"
  version: 1.0.0
  description: Quản lý trạng thái trực tuyến/ngoại tuyến của tài xế.
servers:
  - url: http://localhost:8080/api/v1
    description: Local
tags:
  - name: DriverOperation
    description: Tác nghiệp dành cho tài xế
paths:
  /driver/status:
    patch:
      security:
        - bearerAuth: []
      summary: Cập nhật trạng thái hoạt động tài xế
      tags:
        - DriverOperation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverStatusRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Đã chuyển sang trạng thái ONLINE
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    DriverStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ONLINE, OFFLINE]
          example: ONLINE
        current_location:
          type: object
          properties:
            latitude:
              type: number
              example: 10.776889
            longitude:
              type: number
              example: 106.700806