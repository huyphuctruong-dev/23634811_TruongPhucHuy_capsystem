openapi: 3.0.3
info:
  title: "CAB System API - Giám sát Chuyến đi (UC22)"
  version: 1.0.0
  description: API dành cho Admin và Điều hành viên giám sát danh sách chuyến đi theo thời gian thực với các bộ lọc trạng thái, thời gian và phân trang.
servers:
  - url: http://localhost:8080/api/v1
    description: Local

tags:
  - name: Admin Operations
    description: Các thao tác giám sát, quản lý và điều hành hệ thống dành cho Admin

paths:
  /admin/trips:
    get:
      summary: Admin / Điều hành viên xem danh sách cuốc xe real-time
      operationId: getAdminTrips
      tags:
        - Admin Operations
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: Lọc theo trạng thái chuyến đi
          schema:
            type: string
            enum: [REQUESTED, DISPATCHING, ACCEPTED, DRIVER_ARRIVED, IN_PROGRESS, COMPLETED, CANCELLED]
          example: IN_PROGRESS
        - name: zone_id
          in: query
          required: false
          description: Lọc chuyến đi theo khu vực
          schema:
            type: string
          example: zone_q1_hcm
        - name: page
          in: query
          required: false
          description: Trang hiện tại
          schema:
            type: integer
            default: 1
          example: 1
        - name: limit
          in: query
          required: false
          description: Số lượng bản ghi trên mỗi trang
          schema:
            type: integer
            default: 20
          example: 20
      responses:
        '200':
          description: Lấy danh sách chuyến đi thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  total:
                    type: integer
                    description: Tổng số chuyến đi thỏa mãn điều kiện
                    example: 50
                  page:
                    type: integer
                    example: 1
                  limit:
                    type: integer
                    example: 20
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminTripSummary'
        '401':
          description: Chưa xác thực hoặc Token hết hạn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: UNAUTHORIZED
                  message: Token không hợp lệ hoặc đã hết hạn.
        '403':
          description: Không có quyền truy cập (Chỉ Admin / Điều hành viên mới có quyền)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: FORBIDDEN
                  message: Bạn không có quyền truy cập chức năng giám sát chuyến đi.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    AdminTripSummary:
      type: object
      properties:
        trip_id:
          type: string
          example: trip_12345
        passenger:
          type: object
          properties:
            passenger_id:
              type: string
              example: pass_001
            name:
              type: string
              example: "Nguyen Van A"
            phone:
              type: string
              example: "0901234567"
        driver:
          type: object
          nullable: true
          properties:
            driver_id:
              type: string
              example: drv_009
            name:
              type: string
              example: "Nguyen Van B"
            phone:
              type: string
              example: "0987654321"
            license_plate:
              type: string
              example: "51H-123.45"
        status:
          type: string
          enum: [REQUESTED, DISPATCHING, ACCEPTED, DRIVER_ARRIVED, IN_PROGRESS, COMPLETED, CANCELLED]
          example: IN_PROGRESS
        pickup_address:
          type: string
          example: "227 Nguyễn Văn Cừ, Quận 5, TP.HCM"
        dropoff_address:
          type: string
          example: "Thảo Cầm Viên, Quận 1, TP.HCM"
        fare_amount:
          type: number
          example: 85000
        payment_method:
          type: string
          enum: [CASH, WALLET, CREDIT_CARD]
          example: CASH
        created_at:
          type: string
          format: date-time
          example: "2026-09-18T13:30:00Z"

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: FORBIDDEN
            message:
              type: string
              example: Bạn không có quyền truy cập chức năng giám sát chuyến đi.